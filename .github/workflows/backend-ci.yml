# backend-ci.yml — Python 后端 CI (T122)
#
# 触发: src/, tests/, scripts/, pyproject.toml 改动
# 步骤: ruff check + format + audit + design-check + pytest --cov-fail-under=80
name: backend-ci

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install --upgrade uv

      - name: Setup venv + install deps
        run: |
          uv venv
          # shellcheck disable=SC1091
          source .venv/bin/activate
          uv pip install -e '.[dev]'

      - name: ruff check
        run: |
          source .venv/bin/activate
          ruff check src tests scripts

      - name: ruff format check
        run: |
          source .venv/bin/activate
          ruff format --check src tests scripts

      - name: audit-loop (L0/L1/L2/L4/L5/L7/L8)
        run: |
          source .venv/bin/activate
          python3 scripts/audit-loop.py --strict

      - name: DESIGN ↔ main.css check
        run: python3 scripts/design-check.py

      - name: pytest + coverage
        run: |
          source .venv/bin/activate
          PYTHONPATH=src python -m pytest tests/unit \
            --cov=src/ai_github_radar \
            --cov-report=xml \
            --cov-report=term \
            --cov-fail-under=80

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}