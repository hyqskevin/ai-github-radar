# ai-github-radar · pyproject.toml
# AI 驱动的 GitHub 项目发现 CLI（基于 agent-loop-scaffold 标准）
#
# 字段说明:
#   [project]                  — 必备,uv sync 需要此节
#   [project.optional-dependencies]
#                              — dev / prod 依赖分组
#   [project.scripts]          — CLI 入口点: `ai-github-radar` 命令
#   [tool.pytest.ini_options]  — pytest 发现规则与 marker
#   [tool.ruff]                — ruff 格式/lint
#   [tool.mypy]                — mypy 静态类型检查
[project]
name = "ai-github-radar"
version = "0.1.0"
description = "AI-driven GitHub project discovery: learn from your stars, extract keywords, periodically fetch trending matches"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "hyqskevin" }]
license = { text = "MIT" }

# 生产依赖
dependencies = [
  # GitHub API
  "PyGithub>=2.1",         # GitHub REST API 客户端
  "httpx>=0.27",           # trending HTML / search API 直连
  "beautifulsoup4>=4.12",  # trending 页面解析

  # 数据 / 关键字
  "scikit-learn>=1.5",     # TF-IDF
  "numpy>=1.26",

  # 配置 / CLI / 日志
  "pydantic>=2.7",         # Settings + 校验
  "pydantic-settings>=2.3",
  "typer>=0.12",           # CLI 框架
  "rich>=13.7",            # CLI 美化输出
  "loguru>=0.7",           # 日志

  # 数据库
  "sqlalchemy>=2.0",
  "alembic>=1.13",

  # 本地 UI
  "fastapi>=0.110",          # web/app.py FastAPI
  "uvicorn>=0.29",           # radar web 启动
  "jinja2>=3.1",             # push/local.py Markdown 渲染

  # LLM（可选）
  "openai>=1.40",            # LLM 关键字升级 / 摘要
  "anthropic>=0.34",         # LLM 关键字升级
]

[project.optional-dependencies]
# 开发依赖：测试 / lint / 类型检查
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "pytest-mock>=3.14",
  "respx>=0.21",            # httpx mock
  "freezegun>=1.5",         # 时间 mock（测 daemon）
  "ruff>=0.6",
  "mypy>=1.10",
  "pyyaml>=6.0",          # CI workflow 验证需要
  "types-PyYAML>=6.0",
  "croniter>=6.0",        # cron 表达式解析 + next_run_at 估算
]
prod = []

[project.scripts]
# CLI 入口：装完后 `ai-github-radar` 命令可用
ai-github-radar = "ai_github_radar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/ai_github_radar"]

# ----------------------------------------------------------------------
# tool 配置
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --tb=short --cov=ai_github_radar --cov-report=term-missing"
markers = [
  "integration: needs DB / external services",
  "slow: long-running (>1s)",
  "e2e: end-to-end flow",
]
# 阶段一放宽:macOS 自带 LibreSSL 2.8.3 不被 urllib3 v2 支持,
# 触发 NotOpenSSLWarning。"ignore::Warning" 临时压住;阶段二容器化时
# 改用 py3.12 + 官方 OpenSSL 镜像即可恢复 "error" 严格策略。
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:pkg_resources",
  "ignore::Warning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true